<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Whitsundays（暫定行程）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{--bg:#f7f2ea;--card:#fffdf8;--fg:#2c3a3d;--muted:#7a8285;--line:#ebe2d4;--sea:#3fa7b5;--sea2:#bfe6ea;--sand:#f1e3c8;--coral:#e8826b;--palm:#3f8a5c;--sun:#f3b64f;
--warn:#c0573f;--warnbg:#fbe9e2;--ok:#3f8a5c;
--pc1:#3fa7b5;--pc2:#e8826b;--pc3:#d9a441;--pc4:#5b9bd5;--pc5:#9a86c9;
--shadow:0 1px 2px rgba(90,70,40,.05),0 8px 24px rgba(90,70,40,.08);
--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Songti TC",serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1e1f;--card:#24292a;--fg:#ece6dc;--muted:#a5a59f;--line:#363b3b;--sea:#6cc4cf;--sea2:#24484d;--sand:#3a3427;--coral:#f09a85;--warn:#ff9a80;--warnbg:#3a231c;--ok:#8cc29a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65}
button,input{font:inherit;color:inherit}
a{color:var(--sea)}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 100px}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:300px;padding:26px 24px 120px;color:#fff;
background:linear-gradient(180deg,#f7c98b 0%,#f2a98a 28%,#7fc6d0 62%,#3fa7b5 100%);box-shadow:var(--shadow)}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:auto;display:block;z-index:0}.hero>:not(svg){z-index:1}@media (min-width:700px){.hero{padding-bottom:170px}}
.hero .kick{font-size:13px;letter-spacing:.25em;text-transform:uppercase;opacity:.9;position:relative}
.hero h1{font-family:var(--serif);font-size:clamp(2rem,7vw,3.1rem);line-height:1.15;margin:6px 0 8px;position:relative;text-shadow:0 2px 12px rgba(120,60,30,.25)}
.hero p{margin:0;position:relative;font-size:15px;opacity:.95}
.vibe{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;position:relative}
.vibe span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 12px;font-size:13px}
.alert{background:var(--warnbg);border-radius:16px;padding:12px 16px;margin:16px 0;font-size:14px}
.alert b{color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:var(--shadow);margin:0 0 16px}
.tabs button{flex:1;border:0;border-radius:999px;padding:8px 10px;background:transparent;color:var(--muted);cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--sea);color:#fff}
/* overview strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 18px}
.strip a{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:var(--shadow);border-top:4px solid var(--dc)}
.strip .dd{display:block;font-size:12px;color:var(--muted)}.strip .em{font-size:24px;line-height:1.2}.strip b{display:block;font-size:13px}.strip small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
@media (max-width:520px){.strip{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}.strip small{display:none}}
/* day cards */
.day{background:var(--card);border-radius:24px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden;scroll-margin-top:64px}
.dhead{padding:18px 20px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 22%,var(--card)),var(--card) 70%)}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.dtop .dn{font-weight:700;color:var(--dc);letter-spacing:.06em}
.day h2{font-family:var(--serif);font-size:1.45rem;margin:4px 0 2px;line-height:1.3}
.mood{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;border-radius:999px;padding:1px 10px;background:var(--bg);color:var(--muted)}
.tag.ph{background:var(--warnbg);color:var(--warn);font-weight:700}
.tag.pace{background:color-mix(in srgb,var(--palm) 14%,var(--card));color:var(--palm)}
.dbody{padding:4px 20px 18px}
.note{border-radius:14px;padding:9px 13px;margin:10px 0;font-size:13.5px;background:var(--bg)}
.note b{color:var(--dc)}
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:4.6em 1.8em minmax(0,1fr);gap:0 6px;padding:7px 0;border-top:1px dashed var(--line);align-items:start}
.tl li:first-child{border-top:0}
.tl .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.tl .i{font-size:17px;line-height:1.3;text-align:center}
.tl .a small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.tl li.opt .a::before{content:"可選";font-size:11px;font-weight:700;color:var(--pc5);border:1px dashed var(--pc5);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px}
.tl li.bk .a::after{content:"要預訂";font-size:11px;font-weight:700;color:var(--coral);border:1px solid var(--coral);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.stay{margin-top:12px;font-size:13.5px;color:var(--coral);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
/* panels */
.panel{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.panel h2{font-family:var(--serif);font-size:1.25rem;margin:0 0 6px}
.panel h3{font-size:1rem;margin:18px 0 6px}
.bnote{font-size:13px;color:var(--muted);margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--sea);border-radius:999px;overflow:hidden}
.seg button{font-size:12.5px;padding:3px 13px;border:0;background:transparent;color:var(--sea);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sea);color:#fff}
.bctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:14px}
.ghost{font-size:12.5px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.bt{width:100%;border-collapse:collapse;font-size:13.5px}
.bt td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.bt tr.cat td{font-weight:700;font-size:12.5px;color:var(--muted);padding-top:14px;border-bottom:0}
.bt tr.off td:not(:first-child){opacity:.4}
.bt small{display:block;color:var(--muted);font-size:11.5px}
.bt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bt input[type=number]{width:5.4em;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.bt input[type=checkbox]{width:17px;height:17px;accent-color:var(--sea)}
.bt .bas{display:block;font-size:11px;color:var(--muted);text-align:right}
.btot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.btot div{border-radius:16px;padding:10px 12px;background:var(--bg)}
.btot b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}.btot small{color:var(--muted);font-size:12px}
.btot .you{background:var(--sea);color:#fff}.btot .you small{color:inherit;opacity:.85}
@media (max-width:520px){.btot{grid-template-columns:1fr 1fr}.btot .you{grid-column:1/-1}}
.src{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.8}
.chk{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.chk li{background:var(--bg);border-radius:12px;padding:8px 12px}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ok);flex:0 0 auto;margin-top:3px}
.chk .w{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.chk li.done .n{text-decoration:line-through;color:var(--muted)}
.prog{font-size:13.5px;margin:0 0 8px}.prog i{display:block;height:8px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}.prog i b{display:block;height:100%;background:var(--ok)}
details.ts{border-top:1px solid var(--line)}details.ts:first-of-type{border-top:0}
details.ts summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-weight:700;padding:10px 0}
details.ts summary::-webkit-details-marker{display:none}details.ts summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
details.ts[open] summary::after{content:"−"}
.tdl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 12px;margin:0 0 12px;font-size:14px}
.tdl dt{font-weight:700;color:var(--sea)}.tdl dd{margin:0}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kick">Whitsundays · 2027</div>
    <h1>白沙、海風、<br>慢慢過五日</h1>
    <p>3 月 27–31 日 · 住 Airlie Beach · 2 人</p>
    <div class="vibe"><span>🌿 瀑布</span><span>🐠 外堡礁浮潛</span><span>🏝 Whitehaven 白沙</span><span>🛥 水上摩托</span><span>🌅 日落約 6:10pm</span></div>
    <svg viewBox="0 0 800 160" preserveAspectRatio="none" aria-hidden="true">
      <circle cx="610" cy="40" r="34" fill="#fff3c9" opacity=".85"/>
      <path d="M0 70 C120 55 220 85 360 70 S620 50 800 66 V160 H0Z" fill="#7fd0d9" opacity=".55"/>
      <path d="M0 98 C140 80 260 112 420 96 S660 80 800 98 V160 H0Z" fill="#4fb5c2" opacity=".7"/>
      <path d="M0 128 C160 112 300 140 470 124 S690 112 800 126 V160 H0Z" fill="var(--bg)"/>
      <path d="M520 84 C560 60 640 60 690 82Z" fill="#f4e6c6"/>
      <path d="M600 78 C596 50 600 32 610 16" stroke="#7a5a3c" stroke-width="4" fill="none" stroke-linecap="round"/>

      <path d="M150 70 l16 0 l-8 -24z" fill="#fff"/><path d="M142 72 h32 l-5 6 h-22z" fill="#f2f2f2"/>

  <div class="alert"><b>⚠️ 復活節週末：</b>27–29 號全部係昆士蘭公眾假期，3 月 26 號開始放學校假期。機票、住宿、船團要早訂，揀可以免費取消嘅；餐廳可能收公眾假期附加費。</div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-tab="trip">行程</button>
    <button type="button" role="tab" aria-selected="false" data-tab="budget">預算</button>
    <button type="button" role="tab" aria-selected="false" data-tab="tips">貼士</button>
  </div>

  <section id="trip"></section>
  <section id="budget" hidden></section>

  <footer>價錢係 2026 年網上參考價，航班同船期要等 2027 年時刻表再確認。<br>所有時間係昆士蘭時間（3 月比墨爾本慢 1 小時）。</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("wh27b:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("wh27b:"+k,JSON.stringify(v))}catch(e){}}};

/* t, icon, text, cls(opt|bk) */
const DAYS=[
 {em:"🚗",col:"var(--pc1)",date:"3/27",wd:"星期六",title:"落機，先去瀑布游水",mood:"機場取車，順路去 Cedar Creek Falls 游淡水潭，海邊食午餐，然後去 Airlie 還車、睇日落。",ph:"復活節星期六",pace:"🌴🌴 半日活動",short:"瀑布 · 日落",
  note:"Cedar Creek Falls 喺 Proserpine 同 Airlie Beach 之間，即係由機場去 Airlie 嘅路上。今日租一日車就夠，之後唔使再揸。<b>要先確認租車公司接受機場取車、Airlie 還車</b>（或者送車上門／上門收車）。如果航班太遲到，就跳過瀑布，直接揸去 Airlie。",
  s:[["約 07:00","✈️","Jetstar 直航 MEL → PPP（約 3 小時）<small>航班時間待確認</small>","bk"],
     ["約 09:00","🚗","Proserpine 機場取車（一日）","bk"],
     ["09:45","🌿","揸去 Cedar Creek Falls（約 30 分鐘），游水潭、影相<small>啱啱落完雨最多水；大雨之後水急就唔好落水</small>"],
     ["12:00","🍹","午餐：Northerlies Beach Bar & Grill（Woodwark，約 20 分鐘車程）<small>對住海，復活節週末要訂枱</small>","bk"],
     ["14:00","🔑","揸去 Airlie Beach，check-in，還車"],
     ["15:00","🏊","Airlie Beach Lagoon 游水、躺草地<small>免費、有救生員、冇水母</small>"],
     ["17:15","🚶","沿 Bicentennial Walkway 慢慢行去 Coral Sea Marina（約 2 km）"],
     ["18:11","🌅","喺 Marina 飲杯嘢睇日落"],
     ["19:15","🍤","晚餐：Fish D'vine（海鮮 + rum bar）","bk"]],
  stay:"Airlie Beach"},
 {em:"🐠",col:"var(--pc2)",date:"3/28",wd:"星期日",title:"外堡礁浮潛",mood:"去大堡礁外礁嘅 Reefworld 浮台：浮潛、半潛艇、水底觀景室，中午有自助餐。",ph:"復活節星期日",pace:"🌴 長日，但喺浮台好舒服",short:"Reefworld",
  note:"外礁要喺開放海域行大約 2.5 小時，係全程最受風影響嘅一日，所以排最早。出發前 3–5 日睇天氣預報，風大就同 D4 Hamilton 對調。3 月係水母季，落水要著 stinger suit（船上有）。",
  s:[["07:15","☕","Port of Airlie 報到（由住宿行過去）<small>時間以確認信為準</small>","bk"],
     ["07:45","⛴","高速雙體船出發，穿過 Whitsunday 群島去外礁"],
     ["10:30","🐠","Reefworld 浮台：浮潛、半潛艇、水底觀景室"],
     ["12:30","🍱","浮台自助午餐"],
     ["下晝","🤿","再浮潛一輪，或者喺甲板曬太陽"],
     ["17:30","🌇","返到 Airlie"],
     ["19:00","🍜","晚餐：Eastwoods（東南亞菜，人氣高）","bk"]],
  stay:"Airlie Beach"},
 {em:"🏝",col:"var(--pc3)",date:"3/29",wd:"星期一",title:"Whitehaven 白沙一整日",mood:"Chill & Grill：喺 Whitehaven 待成大半日，BBQ 午餐、漂浮、發白日夢。",ph:"復活節星期一",pace:"🌴🌴 船程長，但成日喺沙灘",short:"Chill & Grill",
  note:"Cruise Whitsundays 嘅 Chill & Grill：7:15am 出發、6:20pm 返，喺 Whitehaven 最多可以留 6 個鐘。包 Hill Inlet 導賞、漢堡 BBQ 午餐、早晚茶。可以加訂沙灘 cabana（$30，最多坐 4 人，先到先得）。訂嗰陣問清楚有冇 stinger suit 提供。",
  s:[["07:00","☕","Port of Airlie 報到<small>時間以確認信為準</small>","bk"],
     ["07:15","⛴","開船，穿過 Whitsunday 群島"],
     ["上午","🌀","Hill Inlet：行上觀景台影白沙漩渦，再落沙灘行<small>潮水啱先最靚，船公司會跟潮水安排</small>"],
     ["中午","🍔","Whitehaven 沙灘 BBQ 午餐"],
     ["下晝","🏖","自由時間：游水、漂浮、喺 cabana 下面瞓午覺<small>Solway Circuit 30 分鐘短步道可以行吓</small>"],
     ["","🥾","Chance Bay 步道（約 90 分鐘）","opt"],
     ["18:20","🌇","返到 Airlie，船上睇日落"],
     ["19:00","🍕","輕鬆晚餐，行得到嘅附近食"]],
  stay:"Airlie Beach"},
 {em:"🛥",col:"var(--pc4)",date:"3/30",wd:"星期二",title:"Hamilton Island＋水上摩托",mood:"搭船過島，揸水上摩托兜一圈，下晝喺 Catseye Beach 嘆，最後喺船上睇日落返嚟。",pace:"🌴🌴 自己控制節奏",short:"Hamilton · 水上摩托",
  note:"船由 Cruise Whitsundays 營運，單程約 1 小時，大約 $60 一程；8:00am 去、5:10pm 返。水上摩托係 Hamilton Island 嘅 1 小時導賞團，喺 Marina C-arm（Marina Tavern 對面）出發，兩人一架；12 歲以上、懷孕或者頸背有傷唔可以玩。島上有免費 shuttle。",
  s:[["07:45","☕","Port of Airlie 上船"],
     ["08:00","⛴","船去 Hamilton Island（約 1 小時，或會經 Daydream Island）","bk"],
     ["09:30","🛥","水上摩托導賞團（1 小時，兩人一架）<small>時間以預約為準；風大可能取消</small>","bk"],
     ["11:00","🛺","搭免費 shuttle 或者租 buggy 兜島"],
     ["12:30","🍽","Marina 午餐，望住啲船"],
     ["14:00","🏖","Catseye Beach：游水、kayak、躺沙灘椅"],
     ["","⛰","Passage Peak（單程約 2.7 km、好多樓梯）","opt"],
     ["16:45","🍦","返 Marina，買杯雪糕"],
     ["17:10","🌅","搭船返 Airlie，日落（6:09pm）喺海上睇","bk"],
     ["18:30","🍝","晚餐：La Marina（意大利菜）"]],
  stay:"Airlie Beach"},
 {em:"🏡",col:"var(--pc5)",date:"3/31",wd:"星期三",title:"慢慢返屋企",mood:"最後一個早餐唔使趕。",pace:"🌴🌴 半日",short:"返墨爾本",
  note:"",
  s:[["08:00","🥞","慢慢食早餐，最後游一次 Lagoon","opt"],
     ["09:30","🚌","Check-out，坐 shuttle 去機場","bk"],
     ["約 11:00","✈️","Jetstar 直航 PPP → MEL<small>航班時間待確認</small>","bk"],
     ["約 15:00","🏠","抵達墨爾本（墨爾本時間）"]],
  stay:""}
];

function trip(){
 $("trip").innerHTML=`<nav class="strip">${DAYS.map((D,i)=>`<a href="#d${i+1}" style="--dc:${D.col}" data-go="${i+1}"><span class="em">${D.em}</span><b>D${i+1}</b><span class="dd">${D.date}</span><small>${D.short}</small></a>`).join("")}</nav>`+
 DAYS.map((D,i)=>`<article class="day" id="d${i+1}" style="--dc:${D.col}">
  <div class="dhead"><div class="dtop"><span class="dn">DAY ${i+1}</span><span>${D.date} ${D.wd}</span></div>
  <h2>${D.em} ${D.title}</h2><p class="mood">${D.mood}</p>
  <div class="tags">${D.ph?`<span class="tag ph">${D.ph}</span>`:""}<span class="tag pace">${D.pace}</span></div></div>
  <div class="dbody">${D.note?`<div class="note">${D.note}</div>`:""}
  <ul class="tl">${D.s.map(([t,ic,a,c])=>`<li class="${c||""}"><span class="t">${t}</span><span class="i">${ic}</span><span class="a">${a}</span></li>`).join("")}</ul>
  ${D.stay?`<div class="stay">🛏 住：${D.stay}</div>`:""}</div></article>`).join("");
 $("trip").querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();$("d"+a.dataset.go).scrollIntoView({behavior:"smooth"})});
}

/* budget: id, name, basis, amount, note, defaultOn */
const BDEF=[
 ["交通",[["fl","機票 MEL ⇄ PPP（Jetstar 直航）","pp",550,"復活節旺季估計；平日來回約 $280–450",1],["car","D1 租車一日（機場取、Airlie 還）","tot",120,"暫估；單程還車可能要加錢",1],["fuel","汽油","tot",20,"",1],["sh","回程機場 shuttle","pp",25,"單程約 $22–25",1],["fe","Hamilton Island 船（來回）","pp",120,"約 $60 一程",1]]],
 ["住宿",[["st","Airlie Beach 4 晚","tot",1200,"約 $300／晚，要行得到主街同碼頭",1]]],
 ["玩",[["reef","Reefworld 外堡礁浮潛","pp",319,"Cruise Whitsundays，包午餐同浮潛用具",1],["cg","Whitehaven Chill & Grill","pp",279,"Cruise Whitsundays，包 BBQ 午餐",1],["cb","沙灘 cabana（加購）","tot",30,"最多 4 人",1],["jet","Hamilton 水上摩托（1 架，兩人坐）","tot",200,"暫估，要再查價；Airlie 同類團每架約 $139–259",1],["fly","Heart Reef 觀光飛行（可選）","pp",300,"約 $250–349",0]]],
 ["食",[["fd","5 日餐飲","pp",400,"每人每日約 $80；Reefworld 同 Chill & Grill 包午餐",1]]],
 ["其他",[["in","旅遊保險","pp",50,"要包天氣導致嘅取消",1],["mi","雜費、手信","pp",100,"",1]]]
];
let BUD=store.get("bud3",{}),BM=store.get("bm","pp");const N=2;
const row=id=>BDEF.flatMap(c=>c[1]).find(r=>r[0]===id);
const bget=id=>{const d=row(id),o=BUD[id]||{};return{amt:o.amt??d[3],on:o.on??!!d[5],basis:d[2]}};
const tot=id=>{const b=bget(id);return b.on?(b.basis==="pp"?b.amt*N:b.amt):0};
const fmt=n=>"$"+Math.round(n).toLocaleString("en-AU");
function budget(){
 const all=BDEF.flatMap(c=>c[1]).reduce((s,r)=>s+tot(r[0]),0),v=x=>fmt(BM==="pp"?x/N:x);
 $("budget").innerHTML=`<div class="panel"><h2>預算（澳幣）</h2><p class="bnote">數可以直接改，剔走唔要嘅。「每人」嘅項目會自動 ×2，只會儲存喺呢部裝置。</p>
 <div class="bctl"><div class="seg"><button type="button" data-m="pp" aria-pressed="${BM==="pp"}">每人</button><button type="button" data-m="tot" aria-pressed="${BM==="tot"}">2 人總數</button></div><button type="button" class="ghost" id="brs">還原預設</button></div>
 <table class="bt"><tbody>${BDEF.map(([c,rows])=>`<tr class="cat"><td colspan="4">${c}</td></tr>`+rows.map(([id,n,basis,,note])=>{const b=bget(id);return `<tr class="${b.on?"":"off"}"><td><input type="checkbox" data-on="${id}" ${b.on?"checked":""} aria-label="計入 ${n}"></td><td>${n}${note?`<small>${note}</small>`:""}</td><td class="num"><input type="number" min="0" step="10" data-amt="${id}" value="${b.amt}" aria-label="${n} 金額"><span class="bas">${basis==="pp"?"每人":"總數"}</span></td><td class="num">${v(tot(id))}</td></tr>`}).join("")).join("")}</tbody></table>
 <div class="btot"><div class="you"><b>${fmt(all/N)}</b><small>每人</small></div><div><b>${fmt(all)}</b><small>2 人總數</small></div><div><b>${fmt(all/N/5)}</b><small>每人每日</small></div></div>
 <p class="src">參考：<a href="https://sailing-whitsundays.com/whitsundays/cw-whitehaven-and-hill-inlet-chill-and-grill" target="_blank" rel="noopener">Chill & Grill</a> · <a href="https://sailing-whitsundays.com/article/how-long-is-the-ferry-to-hamilton-island" target="_blank" rel="noopener">Hamilton Island 船</a> · <a href="https://australiatravelquestions.com/?p=25475" target="_blank" rel="noopener">機場 shuttle</a> · <a href="https://www.momondo.com.au/flights/melbourne/proserpine" target="_blank" rel="noopener">MEL–PPP 機票</a></p></div>`;
 const B=$("budget");
 B.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{BM=b.dataset.m;store.set("bm",BM);budget()});
 B.querySelectorAll("[data-on]").forEach(c=>c.onchange=()=>{(BUD[c.dataset.on]??={}).on=c.checked;store.set("bud3",BUD);budget()});
 B.querySelectorAll("[data-amt]").forEach(x=>x.onchange=()=>{(BUD[x.dataset.amt]??={}).amt=Math.max(0,+x.value||0);store.set("bud3",BUD);budget()});
 $("brs").onclick=()=>{BUD={};store.set("bud3",BUD);budget()};
}

const BOOK=[["fl","機票 MEL ⇄ PPP","越早越好","復活節＋學校假期最快爆；揀早到嘅航班，D1 先夠時間去瀑布"],["st","Airlie Beach 住宿 4 晚","越早越好","一定要行得到主街同 Port of Airlie"],["car","D1 租車（機場取、Airlie 還）","訂完機票","先問清楚接唔接受異地還車"],["nl","Northerlies 午餐（3/27）","出發前 2 週","復活節週末"],["reef","Reefworld 外堡礁（3/28）","提早 1–2 個月","揀可以免費取消／改期嘅"],["cg","Whitehaven Chill & Grill（3/29）＋ cabana","提早 1–2 個月","揀可以免費取消嘅"],["fe","Hamilton Island 船（3/30）","提早 1 個月","8:00 去、5:10 返"],["jet","Hamilton 水上摩托（3/30）","提早 1 個月","配合船期，約 9:30"],["sh","回程機場 shuttle（3/31）","出發前 1 個月","冇 Uber，的士 $80–100"],["eat","晚餐訂枱：Fish D'vine、Eastwoods","出發前 2 週",""],["in","旅遊保險","訂完機票即買","要包天氣取消同延誤"]];
let BK=store.get("bk3",{});
const TIPS=[
 ["🌦 3 月天氣",[["溫度","日間約 28°C，好濕熱；海水約 27°C。"],["雨","雨季尾，陣雨多數短而大。"],["風","3–5 月風最大，船同水上摩托有機會顛或者取消。呢個行程冇後備日，D2–D4 連續三日出海：出發前 3–5 日睇預報，風大就將 Reefworld（最受風影響）同 Hamilton 對調；全部揀可以免費取消／改期嘅。"],["颶風","颶風季去到 4 月，買包天氣嘅旅遊保險。"]]],
 ["🪼 水母（stinger）",[["","10 月至 5 月係水母季。喺海度游水、浮潛著 stinger suit（問清楚船團有冇提供，冇就自己租或者帶）。Airlie Beach Lagoon 冇水母，可以放心游。"]]],
 ["🚗 交通",[["D1","機場租車，去完瀑布同 Northerlies 就喺 Airlie 還車；之後唔使揸車。"],["回程","機場 shuttle 約 $22–25 一程，跟航班時間預約；的士 $80–100，冇 Uber。"],["市內","主街、Lagoon、Port of Airlie、Coral Sea Marina 都行得到，但 Airlie 好多斜路，住宿揀近主街嘅。"],["Hamilton","島上有免費 shuttle，亦可以租 golf buggy。"]]],
 ["🕐 時差",[["","3 月墨爾本仲係夏令時間（4 月 4 日結束），昆士蘭冇，所以慢 1 小時。呢頁時間全部係昆士蘭時間。"]]],
 ["🍽 食",[["海鮮","Fish D'vine · Fishi（海鮮外賣）"],["晚餐","Eastwoods（東南亞菜）· La Marina（意大利菜）"],["日落","Anchor Bar（望海）· Coral Sea Marina 一帶"]]],
 ["🎒 執行李",[["海灘","泳衣、reef-safe 防曬、闊邊帽、太陽眼鏡、沙灘巾、防水袋"],["船上","暈浪丸、薄風褸"],["瀑布","拖鞋或者水鞋（石頭滑）、毛巾"],["Hamilton","行山鞋（Passage Peak）、水樽"],["其他","雨褸／縮骨遮、驅蚊水"]]]
];
function tips(){
 const done=BOOK.filter(b=>BK[b[0]]).length;
 $("tips").innerHTML=`<div class="panel"><h2>預訂清單</h2><div class="prog">已訂 ${done} / ${BOOK.length}<i><b style="width:${done/BOOK.length*100}%"></b></i></div>
 <ul class="chk">${BOOK.map(([id,n,w,s])=>`<li class="${BK[id]?"done":""}"><label><input type="checkbox" data-bk="${id}" ${BK[id]?"checked":""}><span><span class="n">${n}</span>${s?`<small>${s}</small>`:""}</span><span class="w">${w}</span></label></li>`).join("")}</ul></div>
 <div class="panel"><h2>貼士</h2>${TIPS.map(([h,it],i)=>`<details class="ts"${i===0?" open":""}><summary>${h}</summary><dl class="tdl">${it.map(([a,b])=>a?`<dt>${a}</dt><dd>${b}</dd>`:`<dd style="grid-column:1/-1">${b}</dd>`).join("")}</dl></details>`).join("")}</div>`;
 $("tips").querySelectorAll("[data-bk]").forEach(c=>c.onchange=()=>{BK[c.dataset.bk]=c.checked;store.set("bk3",BK);tips()});
}

const TABS=["trip","budget","tips"];
function tab(t){document.querySelectorAll("[role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
 TABS.forEach(s=>$(s).hidden=s!==t);if(t==="budget")budget();if(t==="tips")tips();
 try{if(location.hash.slice(1)!==t)history.replaceState(null,"","#"+t)}catch(e){}}
document.querySelectorAll("[role=tab]").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
trip();const h=location.hash.slice(1);tab(TABS.includes(h)?h:"trip");
</script>
</body>
