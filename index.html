<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Whitsundays（暫定行程）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#2b3335;--muted:#7b8285;--line:#e8e3da;--acc:#2f9aa8;--warn:#b9533c;--warnbg:#fbeae4;--ok:#3f8a5c;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1f20;--card:#25292a;--fg:#ebe7df;--muted:#a3a5a1;--line:#373c3c;--acc:#6cc4cf;--warn:#ff9a80;--warnbg:#3a231c;--ok:#8cc29a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.8rem;margin:0}
.hero{position:relative;border-radius:20px;overflow:hidden;padding:22px 20px 110px;margin:0 0 14px;color:#fff;background:linear-gradient(180deg,#f7c98b 0%,#f2a98a 30%,#7fc6d0 65%,#3fa7b5 100%)}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:auto;display:block;z-index:0}.hero>:not(svg){position:relative;z-index:1}
.hero h1{text-shadow:0 2px 10px rgba(120,60,30,.25)}.hero .sub{color:#fff;opacity:.95;margin:2px 0 0}
@media (min-width:700px){.hero{padding-bottom:150px}}

.sub{color:var(--muted);margin:2px 0 14px}
.alert{background:var(--warnbg);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.alert b{color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;margin:0 0 14px}
.tabs button{flex:1;border:0;border-radius:999px;padding:7px;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff}
.day,.panel{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.day h2{font-size:1.1rem;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.day h2 small{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.ph{display:inline-block;font-size:12px;color:var(--warn);margin-top:2px}
.note{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.tl .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl li.opt .a{color:var(--muted)}
.tl li.opt .a::after{content:"（可選）"}
.tl li.bk .a::after{content:" ●";color:var(--warn);font-size:11px}
.leg{font-size:12px;color:var(--muted);margin:0 0 12px}.leg b{color:var(--warn)}
.panel h2{font-size:1.1rem;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--acc);border-radius:999px;overflow:hidden;margin-bottom:8px}
.seg button{font-size:12.5px;padding:3px 12px;border:0;background:none;color:var(--acc);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.bt{width:100%;border-collapse:collapse;font-size:14px}
.bt td{padding:6px 4px;border-bottom:1px solid var(--line)}
.bt tr.off td:not(:first-child){opacity:.4}
.bt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bt input[type=number]{width:5em;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right}
.bt input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.bt small{color:var(--muted);font-size:11.5px}
.tot{display:flex;gap:16px;margin-top:10px;font-size:14px}.tot b{font-size:1.2rem}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:6px 0;border-top:1px solid var(--line)}.chk li:first-child{border-top:0}
.chk label{display:flex;gap:10px;align-items:baseline;cursor:pointer}
.chk input{accent-color:var(--ok)}
.chk .w{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.chk li.done .n{text-decoration:line-through;color:var(--muted)}
.tips{margin:0;padding-left:1.2em;font-size:14px}.tips li{margin:4px 0}
footer{font-size:12px;color:var(--muted);margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Whitsundays 2027</h1>
    <p class="sub">3/27–3/31 · 住 The Sebel Whitsundays（Airlie Beach）· 2 人</p>
    <svg viewBox="0 0 800 160" preserveAspectRatio="none" aria-hidden="true">
      <circle cx="610" cy="40" r="34" fill="#fff3c9" opacity=".85"/>
      <path d="M0 70 C120 55 220 85 360 70 S620 50 800 66 V160 H0Z" fill="#7fd0d9" opacity=".55"/>
      <path d="M0 98 C140 80 260 112 420 96 S660 80 800 98 V160 H0Z" fill="#4fb5c2" opacity=".7"/>
      <path d="M0 128 C160 112 300 140 470 124 S690 112 800 126 V160 H0Z" fill="var(--bg)"/>
      <path d="M520 84 C560 60 640 60 690 82Z" fill="#f4e6c6"/>
      <path d="M600 78 C596 50 600 32 610 16" stroke="#7a5a3c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M610 16 C592 8 576 12 566 24 M610 16 C622 4 640 4 650 14 M610 16 C602 0 588 -2 578 2 M610 16 C628 18 638 28 640 40 M610 16 C594 22 586 32 584 44" stroke="#3f8a5c" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M150 70 l16 0 l-8 -24z" fill="#fff"/><path d="M142 72 h32 l-5 6 h-22z" fill="#f2f2f2"/>
    </svg>
  </header>
  <div class="alert"><b>復活節：</b>3/27–29 係昆士蘭公眾假期兼學校假期，要早訂、揀可免費取消。</div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-tab="trip">行程</button>
    <button type="button" role="tab" aria-selected="false" data-tab="budget">預算</button>
    <button type="button" role="tab" aria-selected="false" data-tab="tips">預訂 / 貼士</button>
  </div>
  <section id="trip"></section>
  <section id="budget" hidden></section>
  <section id="tips" hidden></section>
  <footer>時間係昆士蘭時間（比墨爾本慢 1 小時）。價錢係 2026 年參考價。</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("wh27c:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("wh27c:"+k,JSON.stringify(v))}catch(e){}}};

const DAYS=[
 {date:"3/27 六",title:"抵達 · Cedar Creek Falls",ph:1,note:"機場租車一日，去完瀑布喺 Airlie 還車（要確認可以異地還車）。",
  s:[["07:00","MEL → PPP（Jetstar）","bk"],["09:00","機場取車","bk"],["09:45","Cedar Creek Falls 游水"],["12:00","Northerlies 午餐","bk"],["14:00","The Sebel check-in、還車"],["15:00","Airlie Beach Lagoon"],["17:15","Bicentennial Walkway → Coral Sea Marina"],["18:11","日落"],["19:15","Fish D'vine 晚餐","bk"]]},
 {date:"3/28 日",title:"Reefworld 外堡礁浮潛",ph:1,note:"最受風影響，風大就同 D4 對調。",
  s:[["07:15","Port of Airlie 報到","bk"],["10:30","Reefworld：浮潛、半潛艇（包午餐）"],["17:30","返 Airlie"],["19:00","Eastwoods 晚餐","bk"]]},
 {date:"3/29 一",title:"Whitehaven Chill & Grill",ph:1,note:"",
  s:[["07:00","Port of Airlie 報到","bk"],["上午","Hill Inlet 觀景台"],["中午","Whitehaven BBQ 午餐"],["下晝","Whitehaven 自由時間（可加 cabana）"],["18:20","返 Airlie"]]},
 {date:"3/30 二",title:"Hamilton Island · 水上摩托",ph:0,note:"",
  s:[["08:00","船去 Hamilton","bk"],["09:30","水上摩托 1 小時（兩人一架）","bk"],["12:30","Marina 午餐"],["14:00","Catseye Beach"],["","Passage Peak","opt"],["17:10","船返 Airlie","bk"],["18:30","La Marina 晚餐"]]},
 {date:"3/31 三",title:"返墨爾本",ph:0,note:"",
  s:[["09:30","Shuttle 去機場","bk"],["11:00","PPP → MEL（Jetstar）","bk"]]}
];
function trip(){
 $("trip").innerHTML=`<p class="leg"><b>●</b> 要預訂</p>`+DAYS.map((D,i)=>`<article class="day"><h2><span>D${i+1} ${D.title}</span><small>${D.date}</small></h2>${D.ph?`<span class="ph">復活節公眾假期</span>`:""}${D.note?`<p class="note">${D.note}</p>`:""}<ul class="tl">${D.s.map(([t,a,c])=>`<li class="${c||""}"><span class="t">${t}</span><span class="a">${a}</span></li>`).join("")}</ul></article>`).join("");
}

const BDEF=[["fl","機票","pp",550,1],["car","D1 租車＋油","tot",140,1],["sh","回程機場 shuttle","pp",25,1],["fe","Hamilton 船","pp",120,1],["st","The Sebel 海景 4 晚","tot",896,1],["reef","Reefworld","pp",319,1],["cg","Chill & Grill","pp",279,1],["cb","Cabana","tot",30,1],["jet","水上摩托（1 架）","tot",200,1],["fd","餐飲","pp",400,1],["in","保險","pp",50,1],["mi","雜費","pp",100,1]];
let BUD=store.get("bud",{}),BM=store.get("bm","pp");const N=2;
const bget=r=>{const o=BUD[r[0]]||{};return{amt:o.amt??r[3],on:o.on??!!r[4]}};
const tot=r=>{const b=bget(r);return b.on?(r[2]==="pp"?b.amt*N:b.amt):0};
const fmt=n=>"$"+Math.round(n).toLocaleString("en-AU");
function budget(){
 const all=BDEF.reduce((s,r)=>s+tot(r),0);
 $("budget").innerHTML=`<div class="panel"><h2>預算（澳幣）</h2><div class="seg"><button type="button" data-m="pp" aria-pressed="${BM==="pp"}">每人</button><button type="button" data-m="tot" aria-pressed="${BM==="tot"}">2 人</button></div>
 <table class="bt">${BDEF.map(r=>{const b=bget(r);return `<tr class="${b.on?"":"off"}"><td><input type="checkbox" data-on="${r[0]}" ${b.on?"checked":""} aria-label="${r[1]}"></td><td>${r[1]} <small>${r[2]==="pp"?"每人":"總數"}</small></td><td class="num"><input type="number" min="0" step="10" data-amt="${r[0]}" value="${b.amt}" aria-label="${r[1]}"></td><td class="num">${fmt(BM==="pp"?tot(r)/N:tot(r))}</td></tr>`}).join("")}</table>
 <div class="tot"><span>每人 <b>${fmt(all/N)}</b></span><span>2 人 <b>${fmt(all)}</b></span></div></div>`;
 const B=$("budget");
 B.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{BM=b.dataset.m;store.set("bm",BM);budget()});
 B.querySelectorAll("[data-on]").forEach(c=>c.onchange=()=>{(BUD[c.dataset.on]??={}).on=c.checked;store.set("bud",BUD);budget()});
 B.querySelectorAll("[data-amt]").forEach(x=>x.onchange=()=>{(BUD[x.dataset.amt]??={}).amt=Math.max(0,+x.value||0);store.set("bud",BUD);budget()});
}

const BOOK=[["fl","機票","越早越好"],["st","The Sebel 海景房 $896（確認可免費取消）","越早越好"],["car","D1 租車（異地還車）","訂完機票"],["nl","Northerlies 午餐","2 週前"],["reef","Reefworld","1–2 個月前"],["cg","Chill & Grill＋cabana","1–2 個月前"],["fe","Hamilton 船","1 個月前"],["jet","水上摩托","1 個月前"],["sh","回程 shuttle","1 個月前"],["eat","Fish D'vine、Eastwoods","2 週前"],["in","旅遊保險","訂完機票"]];
const TIPS=["3 月風大，船可能取消：揀可免費取消／改期，出發前睇預報。","水母季：海度落水著 stinger suit；Lagoon 冇水母。","冇 Uber，的士 $80–100。","帶：reef-safe 防曬、帽、暈浪丸、水鞋、薄風褸。"];
let BK=store.get("bk",{});
function tips(){
 const done=BOOK.filter(b=>BK[b[0]]).length;
 $("tips").innerHTML=`<div class="panel"><h2>預訂（${done}/${BOOK.length}）</h2><ul class="chk">${BOOK.map(([id,n,w])=>`<li class="${BK[id]?"done":""}"><label><input type="checkbox" data-bk="${id}" ${BK[id]?"checked":""}><span class="n">${n}</span><span class="w">${w}</span></label></li>`).join("")}</ul></div>
 <div class="panel"><h2>貼士</h2><ul class="tips">${TIPS.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
 $("tips").querySelectorAll("[data-bk]").forEach(c=>c.onchange=()=>{BK[c.dataset.bk]=c.checked;store.set("bk",BK);tips()});
}

const TABS=["trip","budget","tips"];
function tab(t){document.querySelectorAll("[role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
 TABS.forEach(s=>$(s).hidden=s!==t);if(t==="budget")budget();if(t==="tips")tips();
 try{if(location.hash.slice(1)!==t)history.replaceState(null,"","#"+t)}catch(e){}}
document.querySelectorAll("[role=tab]").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
trip();const h=location.hash.slice(1);tab(TABS.includes(h)?h:"trip");
</script>
</body>
</html>
